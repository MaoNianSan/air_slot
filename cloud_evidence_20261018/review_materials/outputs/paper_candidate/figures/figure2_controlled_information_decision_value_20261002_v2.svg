<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7z" fill="#536273"/></marker><style>
.t{font-family:Georgia,'Times New Roman',serif;fill:#12345b}.m{font-family:Georgia,'Times New Roman',serif;fill:#6f88a5}.p{fill:#fff;stroke:#8ea1b4;stroke-width:1.6}.c{fill:#f1f5f8;stroke:#b5c7d8;stroke-width:1}.r{stroke:#c4d2df;stroke-width:1.2}.f{stroke:#536273;stroke-width:2;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1360" height="680" fill="white"/>
<text x="38" y="40" class="t" font-size="28" font-weight="700">Controlled information contrasts and decision value</text>
<text x="38" y="68" class="m" font-size="17">Same decision-time state, different retained information</text><line x1="38" y1="90" x2="1322" y2="90" class="r"/>

<!-- left main panel -->
<rect x="38" y="110" width="690" height="535" rx="7" class="p"/>
<text x="60" y="145" class="t" font-size="22" font-weight="700">Part 1. Controlled information contrasts</text>
<text x="60" y="170" class="m" font-size="15">What information distinction is retained?</text><line x1="60" y1="192" x2="706" y2="192" class="r"/>
<text x="60" y="224" class="t" font-size="16" font-weight="700">Screening signal</text>
<rect x="60" y="239" width="646" height="52" rx="5" class="c"/>
<text x="80" y="270" class="t" font-size="16">Delay priority (<tspan font-style="italic">P</tspan><tspan baseline-shift="super" font-size="10">D</tspan>)</text><text x="328" y="270" class="t" font-size="16">versus</text><text x="420" y="270" class="t" font-size="16">Consequence priority (<tspan font-style="italic">P</tspan><tspan baseline-shift="super" font-size="10">C</tspan>)</text>
<text x="80" y="282" class="m" font-size="11">same candidates and fixed review capacity</text>
<text x="60" y="328" class="t" font-size="16" font-weight="700">Temporal information</text>
<rect x="60" y="343" width="646" height="52" rx="5" class="c"/>
<text x="80" y="374" class="t" font-size="16">Current state</text><text x="302" y="374" class="t" font-size="16">+</text><text x="340" y="374" class="t" font-size="16">admissible operating history</text>
<text x="80" y="387" class="m" font-size="11">same contemporaneous state; history is the added distinction</text>
<text x="60" y="432" class="t" font-size="16" font-weight="700">Uncertainty representation</text>
<rect x="60" y="447" width="646" height="116" rx="5" class="c"/>
<line x1="115" y1="486" x2="650" y2="486" stroke="#536273" stroke-width="2"/><circle cx="130" cy="486" r="9" fill="#91a9bc"/><circle cx="382" cy="486" r="9" fill="#708d9f"/><circle cx="635" cy="486" r="9" fill="#536f83"/>
<text x="108" y="516" class="t" font-size="15" font-weight="700">Point</text><text x="350" y="516" class="t" font-size="15" font-weight="700">Marginal</text><text x="608" y="516" class="t" font-size="15" font-weight="700">Joint</text>
<text x="80" y="540" class="m" font-size="12">representative state</text><text x="317" y="540" class="m" font-size="12">marginal uncertainty</text><text x="549" y="540" class="m" font-size="12">marginals + aligned dependence</text>
<text x="60" y="608" class="m" font-size="13">Common state, consequence mapping, and decision criteria are held fixed.</text>

<!-- right upper -->
<rect x="770" y="110" width="552" height="245" rx="7" class="p"/>
<text x="792" y="145" class="t" font-size="21" font-weight="700">Part 2. Stage I screening</text><text x="792" y="170" class="m" font-size="15">Where can the information difference change the shortlist?</text><line x1="792" y1="192" x2="1300" y2="192" class="r"/>
<text x="792" y="222" class="t" font-size="15" font-weight="700">Common consequence mapping</text><text x="792" y="244" class="m" font-size="12">Flight · Passenger · Resource</text>
<rect x="792" y="258" width="230" height="42" rx="5" class="c"/><text x="851" y="285" class="t" font-size="16" font-weight="700">Top-<tspan font-style="italic">K</tspan> shortlist</text>
<line x1="1045" y1="279" x2="1270" y2="279" stroke="#536273" stroke-width="2"/><circle cx="1115" cy="279" r="8" fill="#91a9bc"/><circle cx="1190" cy="279" r="8" fill="#536f83"/><text x="1060" y="307" class="m" font-size="11">shortlist change · retained value · <tspan font-style="italic">L</tspan><tspan baseline-shift="super" font-size="9">att</tspan></text>

<!-- right lower -->
<rect x="770" y="380" width="552" height="265" rx="7" class="p"/>
<text x="792" y="415" class="t" font-size="21" font-weight="700">Part 3. Stage II local recovery</text><text x="792" y="440" class="m" font-size="15">Within the same shortlisted cases, what target is supported?</text><line x1="792" y1="462" x2="1300" y2="462" class="r"/>
<text x="792" y="492" class="t" font-size="15" font-weight="700">Fixed HJ reference cohort <tspan font-style="italic">R</tspan><tspan baseline-shift="super" font-size="10">*</tspan></text>
<rect x="792" y="507" width="230" height="43" rx="5" class="c"/><text x="839" y="535" class="t" font-size="16" font-weight="700">Activation + target <tspan font-style="italic">u</tspan>*</text>
<line x1="1047" y1="529" x2="1270" y2="529" stroke="#536273" stroke-width="2"/><circle cx="1100" cy="529" r="8" fill="#91a9bc"/><circle cx="1180" cy="529" r="8" fill="#708d9f"/><circle cx="1250" cy="529" r="8" fill="#536f83"/><text x="1047" y="557" class="m" font-size="11">activation · effective target · <tspan font-style="italic">L</tspan><tspan baseline-shift="super" font-size="9">rec</tspan></text>
<rect x="792" y="584" width="508" height="40" rx="5" class="c"/><text x="815" y="610" class="t" font-size="14">Decision changes and losses use one common reference criterion.</text>

<line x1="728" y1="354" x2="762" y2="354" class="f"/><line x1="1046" y1="355" x2="1046" y2="374" class="f"/>
</svg>
