references:
  R01: {source_type: literature_review, citation: "Clausen J, Larsen A, Larsen J, Rezanova NJ. Disruption management in the airline industry: concepts, models and methods. Computers & Operations Research. 2010;37(5):809-821.", doi: "10.1016/j.cor.2009.03.027"}
  R02: {source_type: literature_review, citation: "Su Y, et al. Airline disruption management: a review of models and solution methods. Engineering. 2021;7(4):435-447.", doi: "10.1016/j.eng.2020.08.021"}
  R03: {source_type: literature, citation: "Petersen JD, Solveling G, Clarke JP, Johnson EL, Shebalov S. An optimization approach to airline integrated recovery. Transportation Science. 2012;46(4):482-500.", doi: "10.1287/trsc.1120.0414"}
  R04: {source_type: literature, citation: "Jarrah AIZ, Yu G, Krishnamurthy N, Rakshit A. A decision support framework for airline flight cancellations and delays. Transportation Science. 1993;27(3):266-280.", doi: "10.1287/trsc.27.3.266"}
  R05: {source_type: literature, citation: "Rosenberger JM, Johnson EL, Nemhauser GL. Rerouting aircraft for airline recovery. Transportation Science. 2003;37(4):408-421.", doi: "10.1287/trsc.37.4.408.23271"}
  R06: {source_type: literature, citation: "Lettovsky L, Johnson EL, Nemhauser GL. Airline crew recovery. Transportation Science. 2000;34(4):337-348.", doi: "10.1287/trsc.34.4.337.12316"}
  R07: {source_type: literature, citation: "Bratu S, Barnhart C. Flight operations recovery: new approaches considering passenger recovery. Journal of Scheduling. 2006;9:279-298.", doi: "10.1007/s10951-006-6781-0"}
  R08: {source_type: literature, citation: "Akturk MS, Atamturk A, Gurel S. Aircraft rescheduling with cruise speed control. Operations Research. 2014;62(4):829-845.", doi: "10.1287/opre.2014.1279"}
  R09: {source_type: literature, citation: "Arikan U, Gurel S, Akturk MS. Flight network-based approach for integrated airline recovery with cruise speed control. Transportation Science. 2017;51(4):1259-1287.", doi: "10.1287/trsc.2016.0716"}
  R10: {source_type: literature, citation: "Brunner JO. Rescheduling of flights during ground delay programs with consideration of passenger and crew connections. Transportation Research Part E. 2014;72:236-252.", doi: "10.1016/j.tre.2014.10.004"}
  R11: {source_type: literature, citation: "Engelmann A, et al. Airline ground operations: schedule recovery optimization approach with constrained resources. Transportation Research Part C. 2021;128:103129.", doi: "10.1016/j.trc.2021.103129"}
  R12: {source_type: literature, citation: "Diepen G, van den Akker JM, Hoogeveen JA. A gate reassignment framework for real time flight delays. 4OR. 2010;8:299-318.", doi: "10.1007/s10288-009-0112-1"}

action_evidence:
  A00: {execution_type: executable, provenance: [operational_rule], literature_reference: [R01, R03], eligibility_condition: "Always available as the no-additional-recovery identity action.", required_state_variables: [], description: "Retain the baseline consequence envelope without an additional recovery intervention."}
  A11: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R07, R10], eligibility_condition: "A protected connection exists and both flight and passenger-control authority are available.", required_state_variables: [passenger_connection, connection_slack, successor_schedule], description: "Hold a departure within an explicitly bounded window to protect connecting passengers."}
  A13: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R08, R09], eligibility_condition: "A feasible cruise-time adjustment range exists within aircraft and operational limits.", required_state_variables: [flight_execution_range, remaining_flight_time, aircraft_performance_class], description: "Adjust cruise speed or planned flight time to trade delay recovery against operating burden."}
  A21: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R04], eligibility_condition: "The successor flight can be retimed inside a declared operational window.", required_state_variables: [successor_schedule, retiming_window, downstream_rotation], description: "Apply a bounded departure-time change while preserving declared schedule and rotation constraints."}
  A22: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R01, R02, R10], eligibility_condition: "A slot or ATFM coordination opportunity and relevant authority are available.", required_state_variables: [slot_opportunity, capacity_window, atfm_authority], description: "Coordinate a slot or ATFM timing change to reduce execution and propagation exposure."}
  A23: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R01, R02, R10], eligibility_condition: "A priority or sequence-request window is open and ATFM authority is available.", required_state_variables: [priority_window, departure_sequence, atfm_authority], description: "Request departure priority or sequence adjustment within a declared capacity window."}
  A31: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R07], eligibility_condition: "Passenger itineraries and feasible alternative capacity are available.", required_state_variables: [passenger_itinerary, alternative_itineraries, seat_capacity], description: "Reaccommodate disrupted passengers onto feasible alternative itineraries."}
  A32: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R07, R10], eligibility_condition: "A connection is at risk and an explicit ground-transfer resource is available.", required_state_variables: [passenger_connection, minimum_connection_time, ground_resource], description: "Expedite a passenger transfer using declared ground resources and connection constraints."}
  A33: {execution_type: conditional, provenance: [operational_rule, scenario_assumption], literature_reference: [R02, R07], eligibility_condition: "Passenger disruption exposure is present and the declared care service is available.", required_state_variables: [passenger_exposure, disruption_duration, service_availability], description: "Activate passenger-care services without representing the service as flight-delay mitigation."}
  A41: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R11, R12], eligibility_condition: "A compatible gate or stand is available during the required occupancy interval.", required_state_variables: [gate_resource, stand_compatibility, occupancy_interval], description: "Reassign the aircraft to a compatible gate or stand during disruption recovery."}
  A42: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R11], eligibility_condition: "Additional compatible ground-handling resources can be assigned to the turnaround.", required_state_variables: [ground_resource, remaining_turnaround_tasks, resource_compatibility], description: "Reinforce ground support to compress a feasible subset of remaining turnaround tasks."}
  A43: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R11, R12], eligibility_condition: "A tow path, destination stand, tug and stand resources are simultaneously available.", required_state_variables: [stand_resource, tow_resource, tow_path, occupancy_interval], description: "Tow or reposition an aircraft between compatible stands as part of ground recovery."}
  A51: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R05, R08], eligibility_condition: "A same-fleet replacement aircraft is available and operationally compatible.", required_state_variables: [replacement_aircraft, aircraft_compatibility, maintenance_state, rotation_state], description: "Swap the disrupted aircraft with an available compatible aircraft from the same fleet."}
  A52: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R05], eligibility_condition: "A feasible local rotation reassignment exists and preserves aircraft continuity constraints.", required_state_variables: [rotation_option, aircraft_routes, maintenance_state], description: "Reassign aircraft among local rotations to restore feasible flight coverage."}
  A53: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R05], eligibility_condition: "A standby aircraft is available, compatible and can be activated before the execution deadline.", required_state_variables: [standby_aircraft, aircraft_compatibility, activation_time], description: "Activate a compatible standby aircraft to cover disrupted flight execution."}
  A54: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R05], eligibility_condition: "A cross-fleet substitute satisfies type, capacity, crew and airport compatibility constraints.", required_state_variables: [replacement_aircraft, cross_fleet_compatibility, crew_qualification, seat_capacity], description: "Substitute equipment across fleets subject to explicit compatibility and capacity constraints."}
  A55: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R05], eligibility_condition: "A repositionable aircraft, crew, slots and ferry authority are available.", required_state_variables: [reposition_aircraft, ferry_crew, slot_opportunity, reposition_time], description: "Ferry an aircraft to the disrupted location to restore later rotation coverage."}
  A61: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R06], eligibility_condition: "A replacement crew with matching qualifications and legal duty time is available.", required_state_variables: [replacement_crew, crew_qualification, duty_legality], description: "Swap to another legally qualified crew for the affected flight or duty sequence."}
  A62: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R06], eligibility_condition: "A reserve crew can report before the execution deadline and remains duty legal.", required_state_variables: [reserve_crew, report_time, crew_qualification, duty_legality], description: "Activate a reserve crew to replace an unavailable or disrupted crew."}
  A63: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R06], eligibility_condition: "A feasible reposition or deadhead path exists within duty and transport constraints.", required_state_variables: [crew_reposition, transport_option, duty_legality, arrival_deadline], description: "Reposition or deadhead crew to restore coverage at a different station."}
  A64: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R06], eligibility_condition: "A revised crew-duty sequence satisfies qualification, rest and duty-time rules.", required_state_variables: [crew_duty, duty_legality, crew_pairings, rest_requirements], description: "Repair the disrupted crew schedule by rescheduling legal duty sequences."}
  A71: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R04, R05, R07], eligibility_condition: "Cancellation authority exists and passenger, aircraft and crew consequences are explicitly represented.", required_state_variables: [cancellation_authority, passenger_itinerary, aircraft_routes, crew_duty], description: "Cancel the successor flight under explicit network, resource and passenger consequence accounting."}
  A72: {execution_type: conditional, provenance: [literature, scenario_assumption], literature_reference: [R03, R04, R05, R07], eligibility_condition: "Network truncation authority exists and all affected downstream legs and resources are identified.", required_state_variables: [network_authority, downstream_rotation, passenger_itinerary, aircraft_routes, crew_duty], description: "Cancel a downstream leg and truncate the associated rotation with full downstream consequence accounting."}
