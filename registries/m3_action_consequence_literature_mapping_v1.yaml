mapping:
  A00: {literature: [R01, R03], effect_mechanism: "Identity comparator; no intervention leaves baseline state and consequence envelope unchanged.", affected_components: [], operational_constraints: ["always admissible baseline"], cost_risk_implications: ["retains all baseline residual risk", "no intervention burden"], implementation_assumption: "deterministic identity C_a=C_0", m4_relevance: "baseline comparator only; formally executable"}
