project:
  name: air_slot_overall_run
  version: 2.1.0
paths:
  pre_output: ../pre/output_core/{mode}/AIR_CHAIN_CORE_V2
cohort:
  core_airports:
  - EHAM
  - LFPG
  - EDDF
  - LEMD
  - LEBL
  - EDDM
  primary_stages:
  - t1
  - t2
  - t3
  primary_ratios:
  - 0.2
  - 0.5
  - 0.8
  roles:
    train:
    - train
    - model
    validation:
    - validation
    test:
    - test
    - final_test
m1:
  contract_id: M1_CHAIN_DYNAMIC_DISTRIBUTION_V1
  pre:
    required_contract_id: AIR_CHAIN_CORE_V2
    required_schema_version: air-chain-core-2.0
    required_research_revision: AIR_CHAIN_CORE_V2_R2
    published_bundle_only: true
  architecture:
    type: single_lightweight_gru
    layers: 1
    hidden_size: 8
    hidden_size_sensitivity:
    - 16
    bidirectional: false
    attention: false
    dropout: 0.0
    gradient_clip: 1.0
    weight_decay: 0.0001
  feature_schema:
    version: M1_FEATURE_SCHEMA_V1
    include_missing_mask: true
    include_observation_age: true
    include_stale_mask: true
    include_fallback_mask: true
    include_stage_encoding: true
    include_delta_t: true
  snapshot:
    roll_minutes: 5
    maximum_minutes: 480
    stale_after_minutes: 30.0
    scheduled_grid_required: true
    event_snapshot_allowed: true
  runtime:
    incremental_step_nodes: 1
    revision_replay: full_from_revision
    temporary_state_isolated: true
  artifacts:
    require_model_checkpoint: true
    require_temperature_artifact: true
    allow_identity_temperature_in_formal: false
  readiness:
    target_support_implies_training_pass: false
    target_support_implies_calibration_pass: false
  training:
    max_epochs: REQUIRES_DEVELOPMENT_FREEZE
    learning_rate: REQUIRES_DEVELOPMENT_FREEZE
    batch_size: REQUIRES_DEVELOPMENT_FREEZE
    early_stopping_patience: REQUIRES_DEVELOPMENT_FREEZE
  time:
    roll_minutes: 5
    roll_sensitivity_minutes:
    - 10
    horizons_minutes:
    - 0
    - 30
    - 60
    - 120
    - 180
    - 240
    - 300
    - 360
    - 420
    - 480
    delay_thresholds_minutes:
    - 15
    - 30
    - 60
  distribution:
    bin_minutes: 5
    predecessor_max_minutes: 480
    learned_upper_quantile: 0.995
    overflow_bin: true
  split:
    calibration_source: validation
    calibration_tail_fraction: 0.5
    minimum_episodes_per_partition: 2
  calibration:
    enabled: true
    method: temperature_scaling
    scope: per_target
    fit_partition: calibration
  sampling:
    sample_count: 1000
    base_seed: 20260718
    fixed_episode_random_numbers: true
    bin_representative_mode: FIXED_WITHIN_BIN_UNIFORM
    overflow_mode: TRAINING_EMPIRICAL_TAIL
    min_empirical_tail_count: 30
    dependence_mode: CONDITIONAL_INDEPENDENCE_WITH_STRUCTURAL_COUPLING
  exclusions:
    separate_fast_model: false
    lightgbm_formal_model: false
    independent_takeoff_head: false
    online_weight_update: false
    adaptive_test_calibration: false
    cross_module_training: false
m2:
  identity: EPISODE_PRE_ACTION_LOSS_RECONSTRUCTION_V2
  input_mode: M1_SCENARIO_PLUS_PRE_CONTEXT
  primary_mode: DIRECT_STRUCTURAL_COMPACT
  complexity:
    max_nonzero_breakpoints_per_subitem: 2
    max_primary_context_multipliers_per_subitem: 1
    allow_high_order_interactions: false
    allow_neural_reconstruction: false
  cross_channel:
    primary_mode: DIRECT_ONLY
  learned_correction:
    enabled: false
  constructed_units:
    conversion_level: SUBITEM
    version: CU_V2
  currency:
    code: RMB
    mapping_mode: IDENTITY
    flight_rmb_per_cu: 1.0
    passenger_rmb_per_cu: 1.0
    resource_rmb_per_cu: 1.0
  formal_loss_field: total_pre_action_loss_rmb
  subitem_value_parameters:
