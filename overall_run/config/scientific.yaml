    F_PROPAGATION: NOT_CONFIGURED
    P_DELAY: NOT_CONFIGURED
    P_CONNECTION: NOT_CONFIGURED
    P_CARE: NOT_CONFIGURED
    R_GROUND: NOT_CONFIGURED
    R_TAXI: NOT_CONFIGURED
    R_SCARCITY: NOT_CONFIGURED
  rule_parameters:
