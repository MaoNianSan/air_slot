<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="92mm" viewBox="0 0 1800 920">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#4B5563"/></marker>
 <style>
 .sans{font-family:"Times New Roman",Times,serif;fill:#1F2937}
 .panel{fill:#FFFFFF;stroke:#9CA3AF;stroke-width:2}
 .line{stroke:#4B5563;stroke-width:3;fill:none}
 .label{font-size:30px;font-weight:700}.head{font-size:28px;font-weight:700}
 .body{font-size:26px}.small{font-size:23px}.tiny{font-size:20px}.muted{fill:#6B7280}
 </style>
</defs>
<rect width="1800" height="920" fill="#FFFFFF"/>
<rect class="panel" x="24" y="24" width="1752" height="282" rx="8"/>
<text class="sans label" x="52" y="68">(1) AOCC decision epoch</text>
<text class="sans small muted" x="52" y="102">Two disrupted aircraft-linked chains compete for limited recovery attention.</text>
<rect x="52" y="128" width="1696" height="54" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text class="sans body" x="76" y="163" font-weight="700">Observed delay signal</text>
<text class="sans body" x="400" y="163">similar predicted successor take-off delay</text>
<text class="sans small muted" x="1200" y="163">decision time: before full successor execution is known</text>
<text class="sans body" x="64" y="222" font-weight="700">Chain A</text>
<line x1="202" y1="214" x2="398" y2="214" stroke="#415A77" stroke-width="8"/><line x1="398" y1="214" x2="616" y2="214" stroke="#415A77" stroke-width="8" stroke-dasharray="10 8"/>
<text class="sans small" x="224" y="252">predecessor</text><text class="sans small" x="442" y="252">turnaround</text><text class="sans small" x="662" y="252">successor</text>
<text class="sans body" x="914" y="222" fill="#415A77">aircraft continuity / time exposure</text><text class="sans tiny muted" x="914" y="251">state distinctions retained for the recovery assessment</text>
<text class="sans body" x="64" y="286" font-weight="700">Chain B</text>
<line x1="202" y1="278" x2="398" y2="278" stroke="#C97920" stroke-width="8"/><line x1="398" y1="278" x2="616" y2="278" stroke="#C97920" stroke-width="8" stroke-dasharray="10 8"/>
<text class="sans body" x="914" y="286" fill="#C97920">propagation / itinerary exposure</text>
<rect class="panel" x="24" y="330" width="1752" height="238" rx="8"/>
<text class="sans label" x="52" y="374">(2) From delay baseline to decision-relevant distinctions</text>
<rect x="60" y="414" width="470" height="112" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text class="sans head" x="86" y="451">Delay baseline</text><text class="sans body" x="86" y="488">scalar severity</text><text class="sans small muted" x="86" y="516">similar priority under delay</text>
<line x1="548" y1="470" x2="662" y2="470" class="line" marker-end="url(#arrow)"/><text class="sans tiny muted" x="556" y="445">state added</text>
<rect x="680" y="414" width="520" height="112" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/><text class="sans head" x="706" y="451">State-informed view</text><text class="sans body" x="706" y="488">Flight / Passenger / Resource</text><text class="sans small muted" x="706" y="516">Chain A and Chain B need not rank alike</text>
<line x1="1218" y1="470" x2="1328" y2="470" class="line" marker-end="url(#arrow)"/><text class="sans tiny muted" x="1220" y="445">active comparison</text>
<rect x="1346" y="414" width="390" height="112" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text class="sans head" x="1372" y="451">Decision value</text><text class="sans body" x="1372" y="488">only if the active</text><text class="sans body" x="1372" y="516">comparison changes</text>
<rect class="panel" x="24" y="592" width="1752" height="304" rx="8"/>
<text class="sans label" x="52" y="636">(3) The same information supports two operational decisions</text>
<line x1="880" y1="660" x2="880" y2="688" class="line"/><line x1="880" y1="688" x2="466" y2="688" class="line" marker-end="url(#arrow)"/><line x1="880" y1="688" x2="1294" y2="688" class="line" marker-end="url(#arrow)"/>
<rect x="86" y="714" width="690" height="140" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/><text class="sans head" x="116" y="752" fill="#415A77">Stage I - recovery screening</text><text class="sans body" x="116" y="790">Compare priority across chains</text><text class="sans small muted" x="116" y="824">limited review capacity: which chains enter detailed review?</text>
<rect x="1024" y="714" width="690" height="140" rx="8" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/><text class="sans head" x="1054" y="752" fill="#C97920">Stage II - local recovery</text><text class="sans body" x="1054" y="790">Compare feasible targets within one chain</text><text class="sans small muted" x="1054" y="824">recovery effort and feasibility: activate or choose target?</text>
</svg>