sources:
  flightlist:
    root: ../data/raw/opensky/flightlist/2022
    patterns: ["flightlist_2022*.csv.gz", "flightlist_2022*.csv", "*.parquet"]
    required: true
    source_standard: OPEN_SKY_SCIENTIFIC
    version: "2022"
    columns:
      icao24: icao24
      origin: origin
      destination: destination
      firstseen: firstseen
      lastseen: lastseen
      callsign: callsign

  state_vectors:
    root: ../data/raw/opensky/state_vectors/2022
    patterns: ["date=*/hour=*/states_*.csv.tar", "date=*/hour=*/*.csv.tar"]
    required: true
    source_standard: OPEN_SKY_SCIENTIFIC
    version: "2022"
    columns:
      time: time
      icao24: icao24
      latitude: lat
      longitude: lon
      altitude: baroaltitude
      velocity: velocity
      vertical_rate: vertrate
      heading: heading
      onground: onground
    input_units:
      altitude: feet
      vertical_rate: feet_per_minute
      velocity: metres_per_second
    output_units:
      altitude: metres
      vertical_rate: metres_per_second
      velocity: metres_per_second

  metar:
    root: ../data/raw/metar/2022
    patterns: ["station=*/*.csv", "station=*/*.csv.gz", "station=*/*.parquet"]
    required: true
    source_standard: IEM_METAR
    version: "2022"
    columns:
      airport: station
      observation_time: valid
      wind_speed: sknt
      wind_gust: gust
      visibility: vsby
      ceiling: ceiling
      weather_code: wxcodes
      temperature: tmpf
      dewpoint: dwpf

  aircraft:
    root: ../data/raw/opensky/aircraft_metadata/snapshot=2022-01
    patterns: ["*.csv", "*.csv.gz", "*.parquet"]
    required: false
    source_standard: OPEN_SKY_AIRCRAFT_METADATA
    version: "snapshot=2022-01"
    columns:
      icao24: icao24
      typecode: typecode

  ourairports:
    root: ../data/raw/ourairports/snapshot=2021-12-31
    airports_file: airports.csv
    runways_file: runways.csv
    required: true
    source_standard: OURAIRPORTS
    version: "snapshot=2021-12-31"
    airport_columns:
      ident: ident
      latitude: latitude_deg
      longitude: longitude_deg
      type: type
    runway_columns:
      airport_ident: airport_ident
      closed: closed

  eurostat_passengers:
    root: ../data/raw/eurostat/2022/passengers
    patterns: ["*.json", "*.csv", "*.tsv", "*.parquet"]
    required: true
    source_standard: EUROSTAT_SDMX
    version: "2022"
    columns:
      airport: airport
      month: month
      passengers: passengers

  eurostat_flights:
    root: ../data/raw/eurostat/2022/commercial_flights
    patterns: ["*.json", "*.csv", "*.tsv", "*.parquet"]
    required: true
    source_standard: EUROSTAT_SDMX
    version: "2022"
    columns:
      airport: airport
      month: month
      commercial_flights: commercial_flights
