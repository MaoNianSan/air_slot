paths:
  pre_output: "smoke_pre"
  overall_run_root: "../overall_run"
  overall_artifact_root: "smoke_artifacts"
  output_root: "smoke_output"
run:
  fast_episodes_per_airport: 1
  predictive_samples_fast: 32
  benchmark_samples_fast: 128
  bootstrap_fast: 5
m1:
  enabled: false
  candidate_count: 1
  min_calibration_cell: 2
  historical_min_cells: [2]
  models: [historical, lgbm_quantile]
  lgbm_space:
    num_leaves: [7]
    max_depth: [4]
    min_child_samples: [5]
    learning_rate: [0.08]
    colsample_bytree: [1.0]
    subsample: [1.0]
    reg_lambda: [1.0]
    n_estimators: [30]
    verbosity: [-1]
m2:
  dgp_families: [independent]
m4:
  dgp_families: [smooth]
  static_min_cell: 1
  robust_lambda_grid: [0.25]
