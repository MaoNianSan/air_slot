<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="88mm" viewBox="0 0 1800 880">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#4B5563"/></marker>
 <style>
 .sans{font-family:"Times New Roman",Times,serif;fill:#1F2937}
 .head{font-size:31px;font-weight:700}.subhead{font-size:27px;font-weight:700}
 .body{font-size:26px}.small{font-size:22px}.tiny{font-size:19px}.muted{fill:#6B7280}
 .line{stroke:#4B5563;stroke-width:3;fill:none}
 </style>
</defs>
<rect width="1800" height="880" fill="#FFFFFF"/>
<!-- application scenario -->
<text class="sans head" x="54" y="54">AOCC decision epoch: two disrupted chains compete for recovery attention</text>
<text class="sans small muted" x="54" y="87">The delay baseline is available immediately; aircraft-linked operating context is progressively revealed.</text>
<line x1="54" y1="108" x2="1746" y2="108" stroke="#CBD5E1" stroke-width="2"/>
<text class="sans subhead" x="54" y="151">Observed delay signal</text>
<text class="sans body" x="340" y="151">similar predicted successor take-off delay</text>
<text class="sans small muted" x="1235" y="151">limited review capacity</text>
<!-- timeline -->
<line x1="220" y1="201" x2="655" y2="201" class="line"/>
<line x1="655" y1="201" x2="995" y2="201" class="line" stroke-dasharray="10 8"/>
<circle cx="220" cy="201" r="9" fill="#6B7280"/><circle cx="655" cy="201" r="9" fill="#415A77"/><circle cx="995" cy="201" r="9" fill="#C97920"/>
<text class="sans small" x="190" y="184">PRE</text><text class="sans small" x="625" y="184">TURN</text><text class="sans small" x="957" y="184">TAXI</text>
<text class="sans tiny muted" x="136" y="229">predecessor unresolved</text><text class="sans tiny muted" x="578" y="229">predecessor factual</text><text class="sans tiny muted" x="888" y="229">successor off-block factual</text>
<!-- chains -->
<text class="sans body" x="54" y="278" font-weight="700">Chain A</text>
<line x1="220" y1="270" x2="505" y2="270" stroke="#415A77" stroke-width="8"/><line x1="505" y1="270" x2="805" y2="270" stroke="#415A77" stroke-width="8" stroke-dasharray="10 8"/>
<text class="sans small" x="842" y="278" fill="#415A77">aircraft continuity / time exposure</text>
<text class="sans body" x="54" y="323" font-weight="700">Chain B</text>
<line x1="220" y1="315" x2="505" y2="315" stroke="#C97920" stroke-width="8"/><line x1="505" y1="315" x2="805" y2="315" stroke="#C97920" stroke-width="8" stroke-dasharray="10 8"/>
<text class="sans small" x="842" y="323" fill="#C97920">propagation / itinerary exposure</text>
<text class="sans tiny muted" x="842" y="349">Illustrative operating profiles; no empirical values are shown.</text>
<!-- information conversion -->
<line x1="900" y1="375" x2="900" y2="409" class="line" marker-end="url(#arrow)"/>
<rect x="420" y="412" width="960" height="112" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans subhead" x="460" y="451">State-informed consequence assessment</text>
<text class="sans body" x="460" y="486">Flight / Passenger / Resource distinctions turn similar delay into a decision-relevant comparison.</text>
<text class="sans small muted" x="460" y="512">The retained state determines which operational distinctions remain visible.</text>
<!-- decision split -->
<line x1="900" y1="524" x2="900" y2="552" class="line"/>
<line x1="900" y1="552" x2="430" y2="590" class="line" marker-end="url(#arrow)"/>
<line x1="900" y1="552" x2="1370" y2="590" class="line" marker-end="url(#arrow)"/>
<rect x="64" y="604" width="736" height="194" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans subhead" x="100" y="646" fill="#415A77">Stage I - recovery screening</text>
<text class="sans body" x="100" y="686">Compare priority across chains</text>
<text class="sans small muted" x="100" y="724">Limited review capacity determines which chains</text>
<text class="sans small muted" x="100" y="753">enter detailed recovery review.</text>
<rect x="1000" y="604" width="736" height="194" rx="8" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/>
<text class="sans subhead" x="1036" y="646" fill="#C97920">Stage II - local recovery</text>
<text class="sans body" x="1036" y="686">Compare feasible targets within one chain</text>
<text class="sans small muted" x="1036" y="724">Recovery effort and feasibility determine whether</text>
<text class="sans small muted" x="1036" y="753">local recovery is activated and how much is targeted.</text>
</svg>