<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="94mm" viewBox="0 0 1800 940">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#4B5563"/></marker>
 <style>
 .sans{font-family:"Times New Roman",Times,serif;fill:#1F2937}.title{font-size:32px;font-weight:700}
 .head{font-size:28px;font-weight:700}.body{font-size:24px}.small{font-size:20px}.tiny{font-size:17px}.muted{fill:#6B7280}
 .line{stroke:#4B5563;stroke-width:3;fill:none}.rule{stroke:#CBD5E1;stroke-width:2}
 </style>
</defs>
<rect width="1800" height="940" fill="#FFFFFF"/>
<text class="sans title" x="52" y="52">Decision-time information in rolling airline recovery</text>
<text class="sans small muted" x="52" y="84">An AOCC snapshot: the same delay signal can hide different operational exposure.</text>
<line x1="52" y1="106" x2="1748" y2="106" class="rule"/>
<!-- Part 1 -->
<rect x="52" y="132" width="930" height="748" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
<text class="sans head" x="82" y="172">Part 1. AOCC decision-time state</text>
<text class="sans small muted" x="82" y="201">One aircraft-linked predecessor-successor episode, observed before successor execution is complete.</text>
<!-- rolling state strip -->
<line x1="112" y1="258" x2="820" y2="258" class="line"/><circle cx="150" cy="258" r="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="3"/><circle cx="460" cy="258" r="9" fill="#415A77"/><circle cx="780" cy="258" r="9" fill="#FFFFFF" stroke="#C97920" stroke-width="3"/>
<text class="sans small" x="112" y="236">PRE</text><text class="sans small" x="426" y="236">TURN</text><text class="sans small" x="746" y="236">TAXI</text>
<text class="sans tiny muted" x="112" y="286">unresolved predecessor</text><text class="sans tiny muted" x="388" y="286">predecessor factual</text><text class="sans tiny muted" x="686" y="286">successor off-block unresolved</text>
<text class="sans tiny muted" x="82" y="316">open circle = unresolved; filled circle = factual milestone</text>
<!-- common signal -->
<rect x="82" y="338" width="870" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text class="sans body" x="106" y="372" font-weight="700">Delay priority (P^D)</text><text class="sans body" x="370" y="372">similar predicted successor take-off delay</text>
<!-- Chain A -->
<rect x="82" y="416" width="870" height="128" rx="7" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans body" x="106" y="452" font-weight="700" fill="#415A77">Chain A</text>
<line x1="230" y1="445" x2="330" y2="445" stroke="#415A77" stroke-width="6"/><rect x="330" y="429" width="78" height="32" rx="4" fill="#EEF2F7" stroke="#415A77" stroke-width="2"/><text class="sans tiny" x="345" y="451">turn</text><line x1="408" y1="445" x2="510" y2="445" stroke="#415A77" stroke-width="6" stroke-dasharray="8 6"/>
<text class="sans small" x="106" y="493">context cues</text><rect x="230" y="474" width="160" height="32" rx="4" fill="#EEF2F7"/><text class="sans tiny" x="246" y="496">turnaround buffer</text><rect x="402" y="474" width="148" height="32" rx="4" fill="#DCE6F0"/><text class="sans tiny" x="420" y="496">aircraft continuity</text><rect x="562" y="474" width="164" height="32" rx="4" fill="#EEF2F7"/><text class="sans tiny" x="578" y="496">downstream rotation</text>
<text class="sans tiny muted" x="760" y="496">Flight emphasis</text>
<!-- Chain B -->
<rect x="82" y="566" width="870" height="128" rx="7" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/>
<text class="sans body" x="106" y="602" font-weight="700" fill="#C97920">Chain B</text>
<line x1="230" y1="595" x2="330" y2="595" stroke="#C97920" stroke-width="6"/><rect x="330" y="579" width="78" height="32" rx="4" fill="#FFF2E3" stroke="#C97920" stroke-width="2"/><text class="sans tiny" x="345" y="601">turn</text><line x1="408" y1="595" x2="510" y2="595" stroke="#C97920" stroke-width="6" stroke-dasharray="8 6"/>
<text class="sans small" x="106" y="643">context cues</text><rect x="230" y="624" width="170" height="32" rx="4" fill="#FFF2E3"/><text class="sans tiny" x="246" y="646">passenger connections</text><rect x="412" y="624" width="142" height="32" rx="4" fill="#F6D9B5"/><text class="sans tiny" x="428" y="646">downstream exposure</text><rect x="566" y="624" width="150" height="32" rx="4" fill="#FFF2E3"/><text class="sans tiny" x="583" y="646">resource burden</text>
<text class="sans tiny muted" x="760" y="646">Passenger / Resource emphasis</text>
<line x1="82" y1="738" x2="952" y2="738" class="rule"/>
<text class="sans body" x="82" y="776" font-weight="700">State-informed consequence priority (P^C)</text>
<text class="sans small muted" x="82" y="808">The retained context can distinguish chains that look similar under (P^D).</text>
<!-- arrow -->
<line x1="982" y1="390" x2="1032" y2="390" class="line" marker-end="url(#arrow)"/>
<!-- Part 2 -->
<rect x="1040" y="132" width="708" height="326" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans head" x="1070" y="172">Part 2. Stage I screening</text>
<text class="sans body" x="1070" y="208">Delay priority versus consequence priority under limited capacity</text>
<text class="sans small muted" x="1070" y="238">Which chains enter detailed recovery review?</text>
<line x1="1070" y1="266" x2="1710" y2="266" class="rule"/>
<text class="sans small" x="1070" y="300">delay priority (P^D)</text><line x1="1350" y1="294" x2="1690" y2="294" stroke="#6B7280" stroke-width="5"/><circle cx="1400" cy="294" r="8" fill="#6B7280"/><circle cx="1460" cy="294" r="8" fill="#CBD5E1"/><text class="sans tiny muted" x="1350" y="322">A and B appear close</text>
<text class="sans small" x="1070" y="364">consequence priority (P^C)</text><line x1="1350" y1="358" x2="1690" y2="358" stroke="#415A77" stroke-width="5"/><circle cx="1400" cy="358" r="8" fill="#415A77"/><circle cx="1460" cy="358" r="8" fill="#415A77"/><text class="sans tiny muted" x="1350" y="386">retained context may reorder</text>
<text class="sans small muted" x="1070" y="430">top-K shortlist is the active comparison.</text>
<!-- arrow -->
<line x1="1394" y1="458" x2="1394" y2="496" class="line" marker-end="url(#arrow)"/>
<!-- Part 3 -->
<rect x="1040" y="510" width="708" height="370" rx="8" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/>
<text class="sans head" x="1070" y="550">Part 3. Stage II local recovery</text>
<text class="sans body" x="1070" y="588">For a shortlisted chain: (u=0) versus (u&gt;0)</text>
<text class="sans small muted" x="1070" y="618">The target is selected under a consequence-effort objective.</text>
<line x1="1070" y1="646" x2="1710" y2="646" class="rule"/>
<text class="sans small" x="1070" y="680">Feasible target set</text><text class="sans tiny muted" x="1390" y="680">effort and turnaround feasibility</text>
<line x1="1090" y1="728" x2="1680" y2="728" stroke="#C97920" stroke-width="5"/><circle cx="1140" cy="728" r="9" fill="#CBD5E1"/><circle cx="1390" cy="728" r="9" fill="#C97920"/><circle cx="1580" cy="728" r="9" fill="#C97920"/><text class="sans tiny muted" x="1090" y="758">(u=0): no recovery</text><text class="sans tiny muted" x="1340" y="758">(u&gt;0): positive target</text>
<line x1="1070" y1="792" x2="1710" y2="792" class="rule"/>
<text class="sans small" x="1070" y="830" fill="#C97920">Information value is observed through shortlist or target changes.</text>
</svg>