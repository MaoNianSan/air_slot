schema_version: "V5.0"
experiment: exp4
specification_sensitivity:
  roll_minutes: [5, 10]
  m2_valuation: [BASE, FAMILY_BALANCED, FLIGHT_PRIORITY, PASSENGER_PRIORITY, RESOURCE_PRIORITY]
  m3_response: [LOW_RESPONSE, BASE_RESPONSE, HIGH_RESPONSE]
  lambda: [0.0, 0.10, 0.25, 0.50]
  alpha: [0.80, 0.90, 0.95]
  monte_carlo_s: [250, 500, 1000, 2000, 10000]
operational_strata:
  - turnaround_pressure
  - m1_uncertainty
hard_case: TIGHT_PLUS_HIGH_UNCERTAINTY
retrain_by_stratum: false
portability:
  principal_dataset: data2_2019
  portability_dataset: data1_2019
  support_states: [PRESERVED, DEGRADED, ABSTAIN, UNSUPPORTED]
  silent_substitution_count_required: 0
  downstream_semantic_redefinition_count_required: 0
deployability:
  paths: [STATE_AWARE, FAST]
  scenario_count: 1000
  e2e_p95_gate_seconds: 300
