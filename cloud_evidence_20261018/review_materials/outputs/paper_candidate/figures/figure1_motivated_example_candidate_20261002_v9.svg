<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="86mm" viewBox="0 0 1800 860">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L12,4.5 L0,9 Z" fill="#4B5563"/></marker>
 <style>
 .sans{font-family:"Times New Roman",Times,serif;fill:#1F2937}.title{font-size:32px;font-weight:700}
 .head{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:21px}.tiny{font-size:18px}.muted{fill:#6B7280}
 .line{stroke:#4B5563;stroke-width:3;fill:none}.rule{stroke:#CBD5E1;stroke-width:2}
 </style>
</defs>
<rect width="1800" height="860" fill="#FFFFFF"/>
<text class="sans title" x="52" y="52">Decision-time information in rolling airline recovery</text>
<text class="sans small muted" x="52" y="84">An AOCC example: similar delay can imply different consequence profiles and recovery decisions.</text>
<line x1="52" y1="106" x2="1748" y2="106" class="rule"/>
<!-- Part 1 -->
<rect x="52" y="132" width="930" height="672" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
<text class="sans head" x="82" y="172">Part 1. Decision-time operating state</text>
<text class="sans small muted" x="82" y="202">Two disrupted aircraft-linked chains have similar delay at the AOCC decision epoch.</text>
<line x1="112" y1="255" x2="820" y2="255" class="line"/><circle cx="150" cy="255" r="9" fill="#6B7280"/><circle cx="460" cy="255" r="9" fill="#415A77"/><circle cx="780" cy="255" r="9" fill="#C97920"/>
<text class="sans small" x="118" y="236">predecessor</text><text class="sans small" x="412" y="236">turnaround</text><text class="sans small" x="745" y="236">successor</text>
<text class="sans tiny muted" x="113" y="282">factual milestones enter the state; future execution remains unresolved</text>
<rect x="82" y="318" width="870" height="120" rx="7" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans body" x="108" y="357" font-weight="700" fill="#415A77">Chain A</text><text class="sans small" x="108" y="391">delay priority (P^D)</text><line x1="290" y1="382" x2="500" y2="382" stroke="#6B7280" stroke-width="7"/><text class="sans small" x="545" y="391">tight turnaround</text><text class="sans small muted" x="545" y="420">aircraft continuity</text>
<rect x="82" y="468" width="870" height="120" rx="7" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/>
<text class="sans body" x="108" y="507" font-weight="700" fill="#C97920">Chain B</text><text class="sans small" x="108" y="541">delay priority (P^D)</text><line x1="290" y1="532" x2="500" y2="532" stroke="#6B7280" stroke-width="7"/><text class="sans small" x="545" y="541">passenger connections</text><text class="sans small muted" x="545" y="570">downstream exposure</text>
<line x1="82" y1="630" x2="952" y2="630" class="rule"/>
<text class="sans body" x="82" y="672" font-weight="700">State-informed consequence priority (P^C)</text>
<text class="sans small muted" x="82" y="706">Flight, Passenger, and Resource consequences can distinguish chains</text>
<text class="sans small muted" x="82" y="735">that appear similar under delay alone.</text>
<!-- connector -->
<line x1="982" y1="360" x2="1032" y2="360" class="line" marker-end="url(#arrow)"/>
<!-- Part 2 -->
<rect x="1040" y="132" width="708" height="272" rx="8" fill="#FFFFFF" stroke="#415A77" stroke-width="2"/>
<text class="sans head" x="1070" y="172">Part 2. Stage I screening</text>
<text class="sans body" x="1070" y="212">Delay priority (P^D) versus consequence priority (P^C)</text>
<text class="sans small muted" x="1070" y="244">Which chains enter detailed review under limited capacity?</text>
<rect x="1070" y="276" width="250" height="46" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text class="sans small" x="1090" y="306">Chain A</text><text class="sans tiny muted" x="1180" y="306">candidate</text>
<rect x="1070" y="334" width="250" height="46" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text class="sans small" x="1090" y="364">Chain B</text><text class="sans tiny muted" x="1180" y="364">candidate</text>
<line x1="1390" y1="300" x2="1690" y2="300" stroke="#415A77" stroke-width="5"/><circle cx="1430" cy="300" r="8" fill="#415A77"/><circle cx="1490" cy="300" r="8" fill="#CBD5E1"/><circle cx="1550" cy="300" r="8" fill="#CBD5E1"/><text class="sans tiny muted" x="1390" y="330">top-K review boundary</text>
<!-- connector -->
<line x1="1394" y1="404" x2="1394" y2="458" class="line" marker-end="url(#arrow)"/>
<!-- Part 3 -->
<rect x="1040" y="472" width="708" height="332" rx="8" fill="#FFFFFF" stroke="#C97920" stroke-width="2"/>
<text class="sans head" x="1070" y="512">Part 3. Stage II local recovery</text>
<text class="sans body" x="1070" y="552">For a shortlisted chain: (u=0) or (u&gt;0)?</text>
<text class="sans small muted" x="1070" y="586">The target is selected under a consequence-effort objective.</text>
<line x1="1090" y1="654" x2="1690" y2="654" class="rule"/>
<text class="sans small" x="1070" y="690">Feasible target set</text>
<line x1="1090" y1="730" x2="1680" y2="730" stroke="#C97920" stroke-width="5"/><circle cx="1135" cy="730" r="9" fill="#CBD5E1"/><circle cx="1390" cy="730" r="9" fill="#C97920"/><text class="sans tiny muted" x="1090" y="762">(u=0): no recovery</text><text class="sans tiny muted" x="1340" y="762">(u&gt;0): positive target</text>
<text class="sans small" x="1070" y="792" fill="#C97920">Information value is observed through shortlist or target changes.</text>
</svg>