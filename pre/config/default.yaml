project_version: "2.0.0"
reference_year: 2022
base_seed: 20220717

paths:
  data_root: ../data
  output_root: output_core

runtime:
  progress_level: normal
  adapt_manifest_path: null
  smoke_subset: false
  state_workers: 1
  rebuild_cache: false

core_membership:
  workers: 4
  max_workers: 6
  partition_unit: source_date
  nested_parallelism: false
  reduced_worker_partition_bytes: 1000000000
  single_worker_partition_bytes: 2000000000
  identity:
    state: aircraft_id
    weather: airport_id
    flow: airport_id
  interval: request_start_closed_request_end_closed
  many_to_many: true
  roles:
    - PREDECESSOR_HISTORY
    - PREDECESSOR_ACTIVE
    - TURNAROUND_CONTEXT
    - SUCCESSOR_CONTEXT
    - AIRPORT_CONTEXT
    - WEATHER_CONTEXT

splits:
  train: ["2022-01-01", "2022-05-01"]
  validation: ["2022-05-01", "2022-06-01"]
  test: ["2022-06-01", "2022-07-01"]

airports:
  core: [EHAM, LFPG, EDDF, LEMD, LEBL, EDDM]
  regions:
    EHAM: NW_EUROPE
    EDDF: CENTRAL_EUROPE
    EDDM: CENTRAL_EUROPE
    LFPG: WEST_EUROPE
    LFPO: WEST_EUROPE
    LEMD: IBERIA
    LEBL: IBERIA
    LIRF: SOUTH_EUROPE
    LIMC: SOUTH_EUROPE
    EBBR: NW_EUROPE
    LOWW: CENTRAL_EUROPE
    EKCH: NORDIC
    ESSA: NORDIC
    EFHK: NORDIC
    EIDW: NW_EUROPE
    LPPT: IBERIA
    EPWA: CENTRAL_EUROPE
    LSZH: CENTRAL_EUROPE
    ENGM: NORDIC

flightlist:
  chunk_rows: 250000

event_specs:
  ATOT_MINUS:
    time_column: firstseen_utc
    source_field: firstseen
    support_level: SUPPORTED_PROXY
    reconstruction_method: OPEN_SKY_FIRSTSEEN_PROXY
  ALDT_MINUS:
    time_column: lastseen_utc
    source_field: lastseen
    support_level: SUPPORTED_PROXY
    reconstruction_method: OPEN_SKY_LASTSEEN_PROXY
  AIBT_MINUS:
    time_column: null
    source_field: null
    support_level: UNSUPPORTED
    reconstruction_method: NO_LOCAL_SOURCE_FIELD
  AOBT_PLUS:
    time_column: null
    source_field: null
    support_level: UNSUPPORTED
    reconstruction_method: NO_LOCAL_SOURCE_FIELD
  ATOT_PLUS:
    time_column: firstseen_utc
    source_field: firstseen
    support_level: SUPPORTED_PROXY
    reconstruction_method: OPEN_SKY_FIRSTSEEN_PROXY

availability_lag_minutes:
  state_vector: 0
  metar: 0
  completed_flightlist: 0

request_contract:
  sources: [state, weather, flow]
  availability_semantics: SOURCE_GLOBAL_NATIVE_EVENT_TIME
  interval_type: INPUT_HISTORY_AND_ACTIVE_INTERVAL

eligibility:
  core_eligible: MATCHED_NON_AMBIGUOUS_INSIDE_SPLIT
  engineering_eligible: EQUALS_CORE_ELIGIBLE
  scientific_chain_eligible: SUPPORTED_CHAIN_AND_LABELS
  observed_chain_proxy_scientific_eligible: false

references:
  movement_min_cell: 30
  turnaround_gap_minutes: [20, 360]
  continuity_horizon_minutes: 180
  weather_min_cell: 5
  distance_bins_km: [0, 500, 1000, 1500, 2500, 4000, 1000000]
  physical_movement_minutes: [10, 1440]
  aircraft_seat_reference: {narrow_body: 180, wide_body: 300, regional: 90, turboprop: 72, other: 150, unknown: 150}
  load_factor_bounds: [0.35, 0.98]
  passenger:
    reference_period_semantics: source_period_end_before_or_at_train_cutoff
    monthly_statistics_available: after_source_period_end
    requested_levels: [DESTINATION_LAGGED_MONTH, UNSUPPORTED]
    source_unavailable_levels: [OD_MONTH_AIRCRAFT_GROUP, OD_MONTH]
    maximum_lag_months: 3
    support_policy: PARTIAL_SUPPORT_ALLOWED
    evidence_statuses: [OBSERVED, SUPPORTED_PROXY, FALLBACK_PROXY, UNSUPPORTED, UNOBSERVED]

state_vectors:
  lookback_minutes: 20
  expected_interval_seconds: 10
  minimum_records: 5
  maximum_observation_age_minutes: 5
  minimum_trajectory_coverage: 0.4
  chunk_rows: 250000
  fill:
    enabled: false
    method: none
    max_gap_minutes: 5

flow:
  lookback_minutes: 30
  airport_radius_km: 50
  dedup_key: icao24
  minimum_source_coverage: 0.5

validation:
  complete_day_hours: 24
  require_complete_state_day: true
  minimum_state_retention: 0.8
  strict_core_support: true

mode_overrides:
  fast:
    splits:
      train: ["2022-05-02", "2022-05-17"]
      validation: ["2022-05-23", "2022-05-24"]
      test: ["2022-05-30", "2022-05-31"]
    references:
      movement_min_cell: 1
      weather_min_cell: 1
    sources:
      flightlist:
        patterns: ["flightlist_202205*.csv.gz"]
      state_vectors:
        patterns:
          - "date=2022-05-02/hour=*/states_*.csv.tar"
          - "date=2022-05-09/hour=*/states_*.csv.tar"
          - "date=2022-05-16/hour=*/states_*.csv.tar"
          - "date=2022-05-23/hour=*/states_*.csv.tar"
          - "date=2022-05-30/hour=*/states_*.csv.tar"
  middle:
    runtime:
      adapt_manifest_path: ../data/manifests/middle_current_data_manifest.csv
  full: {}
  diagnostic:
    runtime:
      state_workers: 3
    splits:
      train: ["2022-01-03", "2022-05-01"]
      validation: ["2022-05-01", "2022-05-30"]
      test: ["2022-05-30", "2022-07-01"]
    sources:
      flightlist:
        patterns: ["flightlist_2022*.csv.gz", "flightlist_2022*.csv", "*.parquet"]
      state_vectors:
        patterns: ["date=*/hour=*/states_*.csv.tar", "date=*/hour=*/*.csv.tar"]
