project:
  name: air_slot_overall_run
  version: 2.1.0
paths:
  pre_output: ../pre/output_core/{mode}/AIR_CHAIN_CORE_V2
cohort:
  core_airports:
  - EHAM
  - LFPG
  - EDDF
  - LEMD
  - LEBL
  - EDDM
  primary_stages:
  - t1
  - t2
  - t3
  primary_ratios:
  - 0.2
  - 0.5
  - 0.8
  roles:
    train:
    - train
    - model
    validation:
    - validation
    test:
    - test
    - final_test
m1:
  contract_id: M1_CHAIN_DYNAMIC_DISTRIBUTION_V1
  pre:
    required_contract_id: AIR_CHAIN_CORE_V2
    required_schema_version: air-chain-core-2.0
    required_research_revision: AIR_CHAIN_CORE_V2_R2
    published_bundle_only: true
  architecture:
    type: single_lightweight_gru
    layers: 1
    hidden_size: 8
    hidden_size_sensitivity:
    - 16
    bidirectional: false
    attention: false
    dropout: 0.0
    gradient_clip: 1.0
    weight_decay: 0.0001
  time:
    roll_minutes: 5
    roll_sensitivity_minutes:
    - 10
    horizons_minutes:
    - 0
    - 30
    - 60
    - 120
    - 180
    - 240
    - 300
    - 360
    - 420
    - 480
    delay_thresholds_minutes:
    - 15
    - 30
    - 60
  distribution:
    bin_minutes: 5
    predecessor_max_minutes: 480
    learned_upper_quantile: 0.995
    overflow_bin: true
  split:
    calibration_source: validation
    calibration_tail_fraction: 0.5
    minimum_episodes_per_partition: 2
  calibration:
    enabled: true
    method: temperature_scaling
    scope: per_target
    fit_partition: calibration
  sampling:
    sample_count: 1000
    base_seed: 20260718
    fixed_episode_random_numbers: true
  exclusions:
    separate_fast_model: false
    lightgbm_formal_model: false
    independent_takeoff_head: false
    online_weight_update: false
    adaptive_test_calibration: false
    cross_module_training: false
m2:
  graph_edges:
    F_to_P: 0.15   # IATA(2025): EU ATM airline:passenger cost=60:40
    F_to_R: 0.10   # Ball et al.(2010): resource recovery 8-12% of delay cost
    P_to_R: 0.05   # Kafle & Zou(2016): secondary propagation decay ~0.5
  channel_scale_min_positive: 200
  flight:
    threshold_base: 15.0
    threshold_exposure_slope: 20.0
    threshold_min: 5.0
    threshold_max: 25.0
    time_scale: 15.0
    scale: 15.0
  passenger:
    threshold: 12.0
    saturation: 25.0
    scale: 1.0
  resource:
    threshold: 18.0
    saturation: 35.0
    scale: 1.0
  resource_stress:
    alpha_flow: 0.55
    alpha_infra: 0.3
    alpha_scarcity: 0.15
  required_anchor_groups:
