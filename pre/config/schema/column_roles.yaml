role_definitions:
- IDENTITY
- TIME
- DYNAMIC_CONTINUOUS
- STATIC_CONTINUOUS
- CATEGORICAL
- QUALITY
- EVIDENCE
- LABEL
- TARGET_SOURCE
- REFERENCE
- M2_ANCHOR
- M4_CONSTRAINT_SOURCE
- AUDIT_ONLY
- LINEAGE
- FORBIDDEN_MODEL_INPUT

core_column_roles:
  chain_episode_id: [IDENTITY, LINEAGE]
  predecessor_flight_id: [IDENTITY, LINEAGE]
  successor_flight_id: [IDENTITY, LINEAGE]
  aircraft_id: [IDENTITY, CATEGORICAL]
  turnaround_airport: [IDENTITY, CATEGORICAL]
  episode_start_time: [TIME]
  episode_end_time: [TIME, TARGET_SOURCE, FORBIDDEN_MODEL_INPUT]
  split: [LINEAGE, CATEGORICAL]
  formal_eligible: [QUALITY, AUDIT_ONLY]
  core_eligible: [QUALITY, AUDIT_ONLY]
  engineering_eligible: [QUALITY, AUDIT_ONLY]
  scientific_chain_eligible: [QUALITY, AUDIT_ONLY]
  membership_id: [IDENTITY, LINEAGE]
  observation_id: [IDENTITY, LINEAGE]
  source: [IDENTITY, LINEAGE, CATEGORICAL]
  source_record_id: [IDENTITY, LINEAGE, EVIDENCE]
  source_file: [LINEAGE, EVIDENCE]
  source_hash: [LINEAGE, EVIDENCE]
  retention_status: [AUDIT_ONLY]
  event_name: [CATEGORICAL, EVIDENCE]
  event_time: [TIME, EVIDENCE]
  availability_time: [TIME, EVIDENCE]
  support_level: [QUALITY, EVIDENCE, CATEGORICAL]
  reconstruction_method: [EVIDENCE, LINEAGE, CATEGORICAL]
  observation_time: [TIME, EVIDENCE]
  latitude: [DYNAMIC_CONTINUOUS]
  longitude: [DYNAMIC_CONTINUOUS]
  altitude: [DYNAMIC_CONTINUOUS]
  velocity: [DYNAMIC_CONTINUOUS]
  vertical_rate: [DYNAMIC_CONTINUOUS]
  weather_code: [CATEGORICAL, DYNAMIC_CONTINUOUS]
  wind_speed: [DYNAMIC_CONTINUOUS]
  visibility: [DYNAMIC_CONTINUOUS]
  reference_value: [REFERENCE, M2_ANCHOR]
  cell_size: [REFERENCE, QUALITY]
  fallback_level: [REFERENCE, QUALITY, EVIDENCE]
  y_ob: [LABEL, FORBIDDEN_MODEL_INPUT]
  y_tx: [LABEL, FORBIDDEN_MODEL_INPUT]
  y_to: [LABEL, FORBIDDEN_MODEL_INPUT]
