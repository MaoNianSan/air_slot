project_version: "1.0.0"
upstream:
  overall_run_root: "../overall_run"
  pre_output: "../pre/output"
  artifact_root: "../overall_run/output/artifacts"
  upstream_run_root: null
  overall_run_config: null
  expected_project_version: "1.0.0"
run:
  base_seed: 20260714
  workers: auto
  core_airports: [EHAM, LFPG, EDDF, LEMD, LEBL, EDDM]
  primary_snapshot_stages: [t1, t2, t3]
  fast_flights_per_airport: 100
  full_max_flights: 2000
  validation_max_flights: null
  formal_sample_count_fast: 256
  formal_sample_count_full: 2048
  benchmark_sample_count_fast: 2048
  benchmark_sample_count_full: 8192
  benchmark_sample_count_precision: 32768
  calibration_sample_count: 1024
  precision_max_flights: 500
risk:
  alpha: 0.90
  risk_lambda: 0.25
  weights: {F: 0.3333333333333333, P: 0.3333333333333333, R: 0.3333333333333333}
  regret_tolerance: 1.0e-10
  decomposition_tolerance: 1.0e-8
  null_score_epsilon: 1.0e-8
benchmark:
  reference:
    severity_threshold_minutes: 15.0
    severity_quantile: 0.95
    minimum_cell_size: 500
    epsilon: 1.0e-8
  b1:
    targets: {F: 0.40, P: 0.35, R: 0.35}
    activation_r_coef: 1.00
    activation_x_coef: 0.80
    loss_sigma: 0.20
    theta_multiplier: 0.70
    reduction_sigma: 0.08
    burden_sigma: 0.10
    burden_f_exec: 0.02
    burden_f_capacity: 0.03
    burden_p_exec: 0.02
    burden_p_req: 0.03
    burden_r_exec: 0.04
    burden_r_req: 0.04
  b2:
    targets: {F: 0.45, P: 0.40, R: 0.40}
    loss_sigma_F: 0.20
    loss_sigma_P: 0.22
    loss_sigma_R: 0.25
    theta_multiplier: 0.75
    reduction_sigma: 0.10
    burden_sigma: 0.15
    burden_f_exec: 0.03
    burden_f_capacity: 0.04
    burden_p_exec: 0.03
    burden_p_req: 0.05
    burden_r_exec: 0.06
    burden_r_req: 0.05
    # B2 calibration coefficients
    calib_r_coef_F: 1.00
    calib_raw_F_coef: 0.70
    calib_raw_R_cross: 0.30
    calib_r_coef_P: 0.80
    calib_raw_P_coef: 0.70
    calib_ellF_cross_P: 0.45
    calib_ellF_severity_scale: 0.35
    calib_r_coef_R: 0.70
    calib_raw_R_coef: 0.80
    calib_ellF_cross_R: 0.25
    calib_ellP_cross_R: 0.40
  nondegeneracy:
    enforce: true
    activation_min: 0.10
    activation_max: 0.90
    max_oracle_action_share: 0.70
    min_nonnull_oracle_share: 0.20
    min_harmful_pair_share: 0.05
    b1_max_abs_corr: 0.15
    b2_min_corr: 0.20
    b2_min_tradeoff_pair_share: 0.05
    b2_min_ranking_reversal_episode_share: 0.10
statistics:
  bootstrap_fast: 200
  bootstrap_full: 2000
  confidence_level: 0.95
output:
  output_root: "output"
  save_benchmark_samples: false
  audit_flights: 5
