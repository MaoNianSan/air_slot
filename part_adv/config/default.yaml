# Non-formal reference configuration retained for provenance only.
project_version: "1.0.0"
paths:
  pre_output: "../pre/output"
  overall_run_root: "../overall_run"
  overall_config: null
  overall_artifact_root: "../overall_run/output/artifacts"
  output_root: "output"
run:
  base_seed: 20260714
  workers: auto
  core_airports: [EHAM, LFPG, EDDF, LEMD, LEBL, EDDM]
  m1_airports: [EHAM, EDDF, EDDM, LFPG, LFPO, LEMD, LEBL, LIRF, LIMC, EBBR, LOWW, EKCH, ESSA, EFHK, EIDW, LPPT, EPWA, LSZH, ENGM]
  primary_snapshot_stages: [t1, t2, t3]
  fast_episodes_per_airport: 100
  full_max_episodes: 2000
  precision_max_episodes: 500
  predictive_samples_fast: 256
  predictive_samples_full: 2048
  benchmark_samples_fast: 2048
  benchmark_samples_full: 8192
  benchmark_samples_precision: 32768
  bootstrap_fast: 200
  bootstrap_full: 2000
  auto_fit_overall_artifacts: false
m1:
  enabled: true
  candidate_count: 16
  cv_tie_relative: 0.005
  min_calibration_cell: 500
  historical_min_cells: [100, 250, 500]
  models: [historical, qrf, ngboost_normal, lgbm_quantile, point_residual]
  quantiles: [0.01, 0.025, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.975, 0.99]
  qrf_space:
    n_estimators: [300, 600]
    max_depth: [12, 20, null]
    min_samples_leaf: [20, 50, 100]
    max_features: [0.5, 0.75, 1.0]
    max_samples: [0.7, 1.0]
  ngboost_space:
    base_max_depth: [2, 3]
    base_min_samples_leaf: [20, 50, 100]
    n_estimators: [500, 1000]
    learning_rate: [0.01, 0.03, 0.05]
    minibatch_frac: [0.7, 1.0]
    col_sample: [0.7, 1.0]
  lgbm_space:
    num_leaves: [15, 31, 63]
    max_depth: [8, 12, -1]
    min_child_samples: [50, 100, 250]
    learning_rate: [0.03, 0.05]
    colsample_bytree: [0.7, 1.0]
    subsample: [0.8, 1.0]
    reg_lambda: [0.0, 1.0, 5.0]
    n_estimators: [500]
    verbosity: [-1]
  point_space:
    num_leaves: [15, 31, 63]
    max_depth: [8, 12, -1]
    min_child_samples: [50, 100, 250]
    learning_rate: [0.03, 0.05]
    colsample_bytree: [0.7, 1.0]
    subsample: [0.8, 1.0]
    reg_lambda: [0.0, 1.0, 5.0]
    n_estimators: [500]
    verbosity: [-1]
m2:
  models: [independent, bayesian_network, shared_no_graph, proposed_graph]
  dgp_families: [independent, shared_shock, asymmetric, threshold_tail]
  benchmark_strength: 1.0
  benchmark_strength_grid: [0.75, 1.0, 1.25]
  quantile_min_cell: 500
  bn_prior_grid: [1.0, 5.0, 10.0, 20.0]
  gamma_alpha_grid: [0.0, 0.01, 0.1, 1.0]
  graph_weight_sensitivity: [0.0, 0.1, 0.2, 0.3]
m4:
  response_models: [static, reduction_only, reduction_burden]
  risk_functions: [expected, robust_quantile, mean_cvar]
  dgp_families: [smooth, threshold, coupled, heteroskedastic]
  static_min_cell: 500
  robust_lambda_grid: [0.1, 0.25, 0.5, 0.75, 1.0]
  robust_quantile: 0.99
  cvar_alpha: 0.90
  cvar_lambda: 0.25
  catastrophic_quantile: 0.95
  benchmark_beta_F: 0.50
  benchmark_beta_P: 0.45
  benchmark_beta_R: 0.55
  benchmark_kappa_F: 0.30
  benchmark_kappa_P: 0.25
  benchmark_kappa_R: 0.35
